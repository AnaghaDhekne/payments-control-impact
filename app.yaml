# Databricks App definition. Deploy with the repository root folder as the
# source (Deploy button) or with python -m scripts.deploy_app.
command:
  - streamlit
  - run
  - app/app.py
env:
  - name: RESULTS_ROOT
    value: /Volumes/workspace/default/detective_runs
  - name: QA_ENDPOINT
    value: databricks-gpt-oss-120b
  - name: STREAMLIT_BROWSER_GATHER_USAGE_STATS
    value: "false"
